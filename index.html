<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTI | Intelligence Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff; --neon-green: #39ff14; --neon-red: #ff3131; --neon-purple: #bc13fe;
            --bg-dark: #05070a; --glass: rgba(13, 17, 23, 0.95); --border: rgba(0, 210, 255, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: #e6edf3; font-family: 'JetBrains Mono', monospace; padding: 15px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); margin-bottom: 20px; max-width: 1600px; margin-inline: auto; }
        
        .grid-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; max-width: 1600px; margin: 0 auto; }
        .glass-card { background: var(--glass); border: 1px solid var(--border); border-radius: 10px; padding: 15px; position: relative; }
        
        /* Destaque da Projeção */
        .prediction-box { grid-column: span 1; background: linear-gradient(45deg, rgba(255, 49, 49, 0.1), transparent); border: 1px solid var(--neon-red); }
        .val-big { font-size: 1.8rem; font-weight: bold; color: #fff; display: block; margin: 5px 0; }
        
        /* Form Admin */
        #adminConsole { display: none; background: #0a0d14; border: 1px solid var(--neon-blue); padding: 15px; border-radius: 8px; margin-bottom: 20px; max-width: 1600px; margin-inline: auto; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        input { background: #000; border: 1px solid var(--border); color: var(--neon-blue); padding: 8px; border-radius: 4px; width: 100%; font-size: 0.8rem; }
        
        .btn-cyber { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px 12px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.65rem; transition: 0.3s; }
        .btn-cyber:hover { background: var(--neon-blue); color: #000; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-top: 10px; }
        th { text-align: left; color: var(--neon-blue); padding: 8px; border-bottom: 1px solid var(--border); }
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        
        .badge-update { background: var(--neon-red); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <div>
        <h1 style="font-family: 'Orbitron'; font-size: 1.2rem; color: var(--neon-blue);">GTI MONITOR <small style="font-size: 0.5rem; color: gray;">PREDICTIVE AI</small></h1>
    </div>
    <div id="esusAlert" style="display:none"><span class="badge-update">PENDÊNCIA: ANEXOS E-SUS</span></div>
    <div>
        <button id="authTrigger" class="btn-cyber">Login GTI</button>
        <button id="logoutBtn" class="btn-cyber" style="display:none; border-color:var(--neon-red); color:var(--neon-red)">LOGOUT</button>
    </div>
</header>

<section id="adminConsole">
    <h3 id="consoleTitle" style="color: var(--neon-blue); font-size: 0.7rem; margin-bottom: 10px;">> SISTEMA DE ENTRADA_</h3>
    <div class="admin-grid">
        <input type="hidden" id="editId">
        <div><label style="font-size: 0.6rem;">DATA</label><input type="datetime-local" id="fTS"></div>
        <div><label style="font-size: 0.6rem;">DISCO D: (GB)</label><input type="number" id="fDisk"></div>
        <div><label style="font-size: 0.6rem;">CPU (%)</label><input type="number" id="fCpu"></div>
        <div><label style="font-size: 0.6rem;">RAM (GB)</label><input type="number" id="fRam"></div>
        <div><label style="font-size: 0.6rem;">E-SUS (GB)</label><input type="number" id="fEsus"></div>
        <div style="display: flex; align-items: flex-end; gap: 5px;">
            <button id="submitBtn" class="btn-cyber" style="width:100%">SALVAR</button>
            <button id="cancelEdit" class="btn-cyber" style="display:none; border-color:gray; color:gray">X</button>
        </div>
    </div>
</section>

<div class="grid-main">
    <div class="glass-card prediction-box">
        <h4 style="color: var(--neon-red); font-size: 0.7rem;">PROJEÇÃO DE ESGOTAMENTO (HD)</h4>
        <span class="val-big" id="pDays">Calculando...</span>
        <p id="pDate" style="font-size: 0.65rem; opacity: 0.7;">Analizando dados históricos...</p>
    </div>

    <div class="glass-card">
        <h4 style="font-size: 0.7rem;">STATUS DISCO D:</h4>
        <span class="val-big" id="dDisk">-- GB</span>
        <canvas id="cDisk" height="100"></canvas>
    </div>

    <div class="glass-card">
        <h4 style="font-size: 0.7rem;">CARGA CPU</h4>
        <span class="val-big" id="dCpu">-- %</span>
        <canvas id="cCpu" height="100"></canvas>
    </div>

    <div class="glass-card">
        <h4 style="font-size: 0.7rem;">ANEXOS E-SUS</h4>
        <span class="val-big" id="dEsus" style="color: var(--neon-purple)">-- GB</span>
        <canvas id="cEsus" height="100"></canvas>
    </div>

    <div class="glass-card" style="grid-column: span 1;">
        <h4 style="font-size: 0.7rem;">EQUILÍBRIO DE RECURSOS</h4>
        <canvas id="cRadar" height="200"></canvas>
    </div>
</div>

<section class="glass-card" style="margin-top: 20px; max-width: 1600px; margin-inline: auto;">
    <h4 style="color: var(--neon-blue); font-size: 0.7rem;">> LOGS OPERACIONAIS</h4>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>DISCO</th>
                    <th>CPU</th>
                    <th>RAM</th>
                    <th>E-SUS</th>
                    <th class="adm-col" style="display:none">AÇÕES</th>
                </tr>
            </thead>
            <tbody id="hBody"></tbody>
        </table>
    </div>
</section>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDMZMnUgrSidkhhRSGseSfsVY71aKKaD6s",
    authDomain: "esusmonitoramento-cb9d9.firebaseapp.com",
    projectId: "esusmonitoramento-cb9d9",
    storageBucket: "esusmonitoramento-cb9d9.firebasestorage.app",
    messagingSenderId: "270924557644",
    appId: "1:270924557644:web:920bd5ea08618eebc633e9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let charts = {}, state = { logged: false };

// AUTH
document.getElementById('authTrigger').onclick = () => {
    const u = prompt("User:"); const p = prompt("Pass:");
    if(u === "GTI" && p === "ZXqwas123") {
        state.logged = true;
        document.getElementById('adminConsole').style.display = 'block';
        document.getElementById('authTrigger').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'block';
        document.querySelectorAll('.adm-col').forEach(el => el.style.display = 'table-cell');
        document.getElementById('fTS').value = new Date().toISOString().slice(0, 16);
    }
};
document.getElementById('logoutBtn').onclick = () => location.reload();

// REALTIME LISTENER
db.collection("monitoramento_completo").orderBy("timestamp", "asc").onSnapshot(snap => {
    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    updateUI(data);
});

function updateUI(data) {
    if(!data.length) return;
    const last = data[data.length - 1];

    document.getElementById('dDisk').innerText = last.discoLivre + " GB";
    document.getElementById('dCpu').innerText = last.cpu + " %";
    document.getElementById('dEsus').innerText = (last.esusAnexos || 0) + " GB";

    calculateFullPrediction(data);
    renderCharts(data);
    renderTable(data);
}

// LÓGICA DE PROJEÇÃO MATEMÁTICA
function calculateFullPrediction(data) {
    if(data.length < 3) return;
    
    // Regressão simples usando timestamps e valores de disco
    const x = data.map(d => new Date(d.timestamp).getTime());
    const y = data.map(d => d.discoLivre);
    
    const n = x.length;
    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (let i = 0; i < n; i++) {
        sumX += x[i]; sumY += y[i];
        sumXY += x[i] * y[i]; sumXX += x[i] * x[i];
    }
    
    const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
    const intercept = (sumY - slope * sumX) / n;

    // Se a inclinação for negativa, o disco está acabando
    if(slope < 0) {
        const timeToZero = (0 - intercept) / slope;
        const dateZero = new Date(timeToZero);
        const daysRemaining = Math.round((dateZero - new Date()) / (1000 * 60 * 60 * 24));
        
        document.getElementById('pDays').innerText = daysRemaining + " DIAS";
        document.getElementById('pDate').innerText = "DATA CRÍTICA: " + dateZero.toLocaleDateString();
        document.getElementById('pDays').style.color = daysRemaining < 30 ? "var(--neon-red)" : "var(--neon-green)";
    } else {
        document.getElementById('pDays').innerText = "ESTÁVEL";
        document.getElementById('pDate').innerText = "Nenhuma tendência de queda detectada.";
    }
}

function renderCharts(data) {
    const subset = data.slice(-15);
    const labels = subset.map(d => new Date(d.timestamp).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}));

    const setup = (id, label, color, key) => {
        const ctx = document.getElementById(id).getContext('2d');
        const vals = subset.map(d => d[key] || 0);
        if(charts[id]) { 
            charts[id].data.labels = labels; 
            charts[id].data.datasets[0].data = vals; 
            charts[id].update(); 
        } else {
            charts[id] = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ label, data: vals, borderColor: color, backgroundColor: color+'11', fill: true, tension: 0.3 }] },
                options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { ticks: { font: { size: 8 } } } } }
            });
        }
    };

    setup('cDisk', 'Disco', '#00d2ff', 'discoLivre');
    setup('cCpu', 'CPU', '#ff3131', 'cpu');
    setup('cEsus', 'e-SUS', '#bc13fe', 'esusAnexos');

    // Radar
    const last = data[data.length-1];
    const ctxR = document.getElementById('cRadar').getContext('2d');
    const rData = [last.cpu, (last.ramLivre/64)*100, (last.discoLivre/3000)*100];
    if(charts.radar) { charts.radar.data.datasets[0].data = rData; charts.radar.update(); }
    else {
        charts.radar = new Chart(ctxR, {
            type: 'radar',
            data: { labels: ['CPU', 'RAM', 'HD'], datasets: [{ data: rData, borderColor: '#00d2ff', backgroundColor: 'rgba(0,210,255,0.1)' }] },
            options: { scales: { r: { min: 0, max: 100, ticks: { display: false }, grid: { color: '#222' } } }, plugins: { legend: { display: false } } }
        });
    }
}

function renderTable(data) {
    const body = document.getElementById('hBody');
    body.innerHTML = "";
    [...data].reverse().forEach(r => {
        const row = body.insertRow();
        row.innerHTML = `
            <td>${new Date(r.timestamp).toLocaleDateString()}</td>
            <td>${r.discoLivre}G</td>
            <td>${r.cpu}%</td>
            <td>${r.ramLivre}G</td>
            <td>${r.esusAnexos || 0}G</td>
            <td class="adm-col" style="${state.logged ? '' : 'display:none'}">
                <button class="btn-cyber" style="border-color:var(--neon-green); color:var(--neon-green)" onclick="editMode('${r.id}', ${JSON.stringify(r).replace(/"/g, '&quot;')})">EDIT</button>
                <button class="btn-cyber" style="border-color:var(--neon-red); color:var(--neon-red)" onclick="deleteRec('${r.id}')">X</button>
            </td>
        `;
    });
}

// EDIÇÃO E SALVAMENTO
function editMode(id, data) {
    document.getElementById('editId').value = id;
    document.getElementById('fTS').value = data.timestamp.slice(0, 16);
    document.getElementById('fDisk').value = data.discoLivre;
    document.getElementById('fCpu').value = data.cpu;
    document.getElementById('fRam').value = data.ramLivre;
    document.getElementById('fEsus').value = data.esusAnexos || '';
    document.getElementById('consoleTitle').innerText = "> EDITANDO REGISTRO_";
    document.getElementById('cancelEdit').style.display = "inline-block";
    window.scrollTo(0,0);
}

document.getElementById('cancelEdit').onclick = () => {
    document.getElementById('editId').value = "";
    document.getElementById('consoleTitle').innerText = "> SISTEMA DE ENTRADA_";
    document.getElementById('cancelEdit').style.display = "none";
    document.getElementById('fDisk').value = "";
};

document.getElementById('submitBtn').onclick = async () => {
    const id = document.getElementById('editId').value;
    const payload = {
        timestamp: new Date(document.getElementById('fTS').value).toISOString(),
        discoLivre: parseFloat(document.getElementById('fDisk').value),
        cpu: parseFloat(document.getElementById('fCpu').value),
        ramLivre: parseFloat(document.getElementById('fRam').value),
        esusAnexos: parseFloat(document.getElementById('fEsus').value) || 0
    };

    try {
        if(id) await db.collection("monitoramento_completo").doc(id).update(payload);
        else await db.collection("monitoramento_completo").add(payload);
        alert("SINCRONIZADO!");
        document.getElementById('cancelEdit').click();
    } catch(e) { alert(e.message); }
};

async function deleteRec(id) { if(confirm("Apagar?")) await db.collection("monitoramento_completo").doc(id).delete(); }

setInterval(() => {
    const d = new Date();
    if(d.getDay() === 1) document.getElementById('esusAlert').style.display = 'block';
}, 60000);
</script>
</body>
</html>
