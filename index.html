<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTI | Command Center v4.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff; --neon-green: #39ff14; --neon-red: #ff3131; --neon-purple: #bc13fe; --neon-yellow: #fefe33;
            --bg-dark: #02040a; --glass: rgba(13, 17, 23, 0.9); --border: rgba(0, 210, 255, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark); color: #e6edf3; font-family: 'JetBrains Mono', monospace; padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #111 0%, #02040a 100%);
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 2px solid var(--border); margin-bottom: 25px; max-width: 1600px; margin-inline: auto; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1600px; margin: 0 auto; }
        
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; }
        .val-display { font-size: 2rem; font-weight: bold; color: #fff; margin: 5px 0; display: block; }
        
        /* ADMIN CONSOLE */
        #adminConsole { display: none; border: 1px solid var(--neon-green); margin: 0 auto 25px; max-width: 1600px; padding: 20px; border-radius: 12px; background: rgba(57, 255, 20, 0.05); }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 10px; }
        .backup-zone { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); display: flex; gap: 15px; align-items: center; }
        
        input { background: #000; border: 1px solid var(--border); color: var(--neon-blue); padding: 10px; border-radius: 5px; width: 100%; outline: none; }
        
        .btn-cyber { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 10px 15px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.7rem; transition: 0.3s; text-transform: uppercase; }
        .btn-cyber:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .btn-backup { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .btn-backup:hover { background: var(--neon-yellow); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8rem; }
        th { text-align: left; padding: 12px; color: var(--neon-blue); border-bottom: 1px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        
        .alert-box { background: rgba(255, 49, 49, 0.1); border: 1px solid var(--neon-red); padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 0.8rem; color: var(--neon-red); display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <h1 style="font-family: 'Orbitron'; letter-spacing: 2px;">GTI COMMAND</h1>
        <div id="clock" style="font-size: 0.7rem; opacity: 0.5;">...</div>
    </div>
    <div id="esusAlert" class="alert-box" style="margin-bottom:0; margin-right: 20px;">⚠️ ATUALIZAR ANEXOS E-SUS (SEGUNDA-FEIRA)</div>
    <div>
        <button id="authTrigger" class="btn-cyber">Login GTI</button>
        <button id="logoutBtn" class="btn-cyber" style="display:none; border-color:var(--neon-red); color:var(--neon-red)">Sair</button>
    </div>
</header>

<section id="adminConsole">
    <h2 id="consoleTitle" style="color: var(--neon-green); font-size: 0.9rem;">> MODO ADMINISTRADOR: LANÇAMENTO_</h2>
    <div class="admin-grid">
        <input type="hidden" id="editId">
        <div><label>Data/Hora</label><input type="datetime-local" id="fTS"></div>
        <div><label>Disco D: (GB)</label><input type="number" id="fDisk"></div>
        <div><label>CPU (%)</label><input type="number" id="fCpu"></div>
        <div><label>RAM (GB)</label><input type="number" id="fRam"></div>
        <div><label>Anexos (MB)</label><input type="number" id="fEsus"></div>
        <div style="display: flex; align-items: flex-end; gap: 5px;">
            <button id="submitBtn" class="btn-cyber" style="width:100%; border-color: var(--neon-green); color: var(--neon-green);">Transmitir</button>
            <button id="cancelEdit" class="btn-cyber" style="display:none; border-color: gray; color: gray;">X</button>
        </div>
    </div>

    <div class="backup-zone">
        <span style="font-size: 0.7rem; color: var(--neon-yellow);">DATABASE TOOLS:</span>
        <button onclick="exportToJson()" class="btn-cyber btn-backup">Exportar JSON</button>
        <div style="position: relative;">
            <button class="btn-cyber btn-backup">Restaurar JSON</button>
            <input type="file" id="importFile" onchange="importFromJson(event)" style="position: absolute; inset: 0; opacity: 0; cursor: pointer;">
        </div>
        <span id="backupStatus" style="font-size: 0.6rem; opacity: 0.6;"></span>
    </div>
</section>

<main class="dashboard-grid">
    <div class="glass-card">
        <h3>DISCO D: LIVRE</h3>
        <span class="val-display" id="dDisk">-- GB</span>
        <canvas id="cDisk" height="140"></canvas>
    </div>
    <div class="glass-card">
        <h3>PROCESSAMENTO CPU</h3>
        <span class="val-display" id="dCpu">-- %</span>
        <canvas id="cCpu" height="140"></canvas>
    </div>
    <div class="glass-card">
        <h3>PASTA ANEXOS (e-SUS)</h3>
        <span class="val-display" id="dEsus" style="color: var(--neon-purple)">-- MB</span>
        <canvas id="cEsus" height="140"></canvas>
    </div>
    <div class="glass-card">
        <h3>ESTABILIDADE</h3>
        <canvas id="cRadar" height="200"></canvas>
    </div>
</main>

<section class="glass-card" style="max-width: 1600px; margin: 25px auto;">
    <h3 style="color: var(--neon-blue); font-size: 1rem;">> HISTÓRICO OPERACIONAL</h3>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>DATA/HORA</th>
                    <th>DISCO (GB)</th>
                    <th>CPU (%)</th>
                    <th>RAM (GB)</th>
                    <th>ANEXOS (MB)</th>
                    <th class="adm-col" style="display:none">GESTÃO</th>
                </tr>
            </thead>
            <tbody id="hBody"></tbody>
        </table>
    </div>
</section>

<script>
// CONFIGURAÇÃO FIREBASE
const firebaseConfig = {
    apiKey: "AIzaSyDMZMnUgrSidkhhRSGseSfsVY71aKKaD6s",
    authDomain: "esusmonitoramento-cb9d9.firebaseapp.com",
    projectId: "esusmonitoramento-cb9d9",
    storageBucket: "esusmonitoramento-cb9d9.firebasestorage.app",
    messagingSenderId: "270924557644",
    appId: "1:270924557644:web:920bd5ea08618eebc633e9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let charts = {}, state = { logged: false, fullData: [] };

// AUTH
document.getElementById('authTrigger').onclick = () => {
    const u = prompt("GTI User:"); const p = prompt("Password:");
    if(u === "GTI" && p === "ZXqwas123") {
        state.logged = true;
        document.getElementById('adminConsole').style.display = 'block';
        document.getElementById('authTrigger').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'block';
        document.querySelectorAll('.adm-col').forEach(el => el.style.display = 'table-cell');
    }
};

// EXPORTAR JSON
function exportToJson() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.fullData, null, 2));
    const downloadAnchorNode = document.createElement('a');
    downloadAnchorNode.setAttribute("href", dataStr);
    downloadAnchorNode.setAttribute("download", "gti_backup_" + new Date().getTime() + ".json");
    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
}

// RESTAURAR JSON
async function importFromJson(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const importedData = JSON.parse(e.target.result);
            if (!Array.isArray(importedData)) throw new Error("Formato inválido");
            
            if(confirm(`Deseja restaurar ${importedData.length} registos? Isso não apagará os atuais.`)) {
                const batch = db.batch();
                importedData.forEach(item => {
                    const docRef = db.collection("monitoramento_completo").doc();
                    // Remove IDs antigos para não dar conflito se existirem
                    const { id, ...cleanData } = item;
                    batch.set(docRef, cleanData);
                });
                await batch.commit();
                alert("Restauração concluída com sucesso!");
            }
        } catch (err) {
            alert("Erro ao ler JSON: " + err.message);
        }
    };
    reader.readAsText(file);
}

// LISTENER & DASHBOARD
db.collection("monitoramento_completo").orderBy("timestamp", "asc").onSnapshot(snap => {
    state.fullData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderDashboard(state.fullData);
});

function renderDashboard(data) {
    if(!data.length) return;
    const last = data[data.length - 1];
    document.getElementById('dDisk').innerText = last.discoLivre + " GB";
    document.getElementById('dCpu').innerText = last.cpu + " %";
    document.getElementById('dEsus').innerText = (last.esusAnexos || 0) + " MB";

    // Alerta 7 dias
    const diffDias = (new Date() - new Date(last.timestamp)) / (1000 * 60 * 60 * 24);
    document.getElementById('esusAlert').style.display = (diffDias > 7) ? 'block' : 'none';

    updateCharts(data);
    renderTable(data);
}

function updateCharts(data) {
    const subset = data.slice(-12);
    const labels = subset.map(d => new Date(d.timestamp).toLocaleDateString('pt-PT', {day:'2-digit', month:'2-digit'}));

    const genLine = (id, label, color, key) => {
        const ctx = document.getElementById(id).getContext('2d');
        const vals = subset.map(d => d[key] || 0);
        if(charts[id]) { charts[id].data.labels = labels; charts[id].data.datasets[0].data = vals; charts[id].update(); }
        else { charts[id] = new Chart(ctx, { type:'line', data:{labels, datasets:[{label, data:vals, borderColor:color, backgroundColor: color+'22', fill:true, tension:0.4}]}, options:{plugins:{legend:{display:false}}}}); }
    };

    genLine('cDisk', 'Disco', '#00d2ff', 'discoLivre');
    genLine('cCpu', 'CPU', '#ff3131', 'cpu');
    genLine('cEsus', 'e-SUS', '#bc13fe', 'esusAnexos');

    const last = data[data.length-1];
    const radarData = [last.cpu, (64-last.ramLivre)/64*100, (3000-last.discoLivre)/3000*100];
    if(charts.radar) { charts.radar.data.datasets[0].data = radarData; charts.radar.update(); }
    else {
        charts.radar = new Chart(document.getElementById('cRadar').getContext('2d'), {
            type: 'radar',
            data: { labels: ['CPU', 'RAM', 'DISCO'], datasets: [{ data: radarData, backgroundColor: 'rgba(57, 255, 20, 0.2)', borderColor: '#39ff14' }] },
            options: { scales: { r: { grid:{color:'#333'}, ticks:{display:false}, min:0, max:100 } }, plugins:{legend:{display:false}} }
        });
    }
}

function renderTable(data) {
    const body = document.getElementById('hBody');
    body.innerHTML = "";
    [...data].reverse().forEach(r => {
        const row = body.insertRow();
        row.innerHTML = `
            <td>${new Date(r.timestamp).toLocaleString('pt-PT')}</td>
            <td>${r.discoLivre}</td>
            <td>${r.cpu}</td>
            <td>${r.ramLivre}</td>
            <td style="color:var(--neon-purple)">${r.esusAnexos || 0} MB</td>
            <td class="adm-col" style="${state.logged ? '' : 'display:none'}">
                <button class="btn-cyber btn-edit" onclick="editMode('${r.id}', ${JSON.stringify(r).replace(/"/g, '&quot;')})">Editar</button>
                <button class="btn-cyber btn-delete" onclick="deleteRec('${r.id}')">X</button>
            </td>
        `;
    });
}

async function editMode(id, data) {
    document.getElementById('editId').value = id;
    document.getElementById('fTS').value = data.timestamp.slice(0, 16);
    document.getElementById('fDisk').value = data.discoLivre;
    document.getElementById('fCpu').value = data.cpu;
    document.getElementById('fRam').value = data.ramLivre;
    document.getElementById('fEsus').value = data.esusAnexos || 0;
    document.getElementById('consoleTitle').innerText = "> MODO EDIÇÃO ATIVO_";
    document.getElementById('cancelEdit').style.display = "inline-block";
    window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('submitBtn').onclick = async () => {
    const id = document.getElementById('editId').value;
    const payload = {
        timestamp: new Date(document.getElementById('fTS').value).toISOString(),
        discoLivre: parseFloat(document.getElementById('fDisk').value),
        cpu: parseFloat(document.getElementById('fCpu').value),
        ramLivre: parseFloat(document.getElementById('fRam').value),
        esusAnexos: parseFloat(document.getElementById('fEsus').value) || 0
    };
    try {
        if(id) await db.collection("monitoramento_completo").doc(id).update(payload);
        else await db.collection("monitoramento_completo").add(payload);
        alert("Dados salvos!");
        location.reload();
    } catch(e) { alert("Erro: " + e.message); }
};

async function deleteRec(id) { if(confirm("Apagar?")) await db.collection("monitoramento_completo").doc(id).delete(); }
setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleString('pt-PT'), 1000);
</script>
</body>
</html>
